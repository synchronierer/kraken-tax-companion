services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-sqlite:////data/kraken-tax-companion.db}
      APP_CORS_ORIGINS: '${APP_CORS_ORIGINS:-["http://localhost:5173"]}'
      APP_COINGECKO_BASE_URL: ${APP_COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
      APP_COINGECKO_API_MODE: ${APP_COINGECKO_API_MODE:-disabled}
      APP_COINGECKO_API_KEY: ${APP_COINGECKO_API_KEY:-}
      APP_COINGECKO_TIMEOUT_SECONDS: ${APP_COINGECKO_TIMEOUT_SECONDS:-15}
      APP_COINGECKO_MIN_INTERVAL_SECONDS: ${APP_COINGECKO_MIN_INTERVAL_SECONDS:-2.1}
      APP_COINGECKO_RATE_LIMIT_RETRY_BASE_SECONDS: ${APP_COINGECKO_RATE_LIMIT_RETRY_BASE_SECONDS:-30}
      APP_KRAKEN_API_KEY: ${APP_KRAKEN_API_KEY:-}
      APP_KRAKEN_API_SECRET: ${APP_KRAKEN_API_SECRET:-}
      APP_KRAKEN_API_BASE_URL: ${APP_KRAKEN_API_BASE_URL:-https://api.kraken.com}
      APP_KRAKEN_API_TIMEOUT: ${APP_KRAKEN_API_TIMEOUT:-15}
      APP_KRAKEN_LEDGER_MIN_INTERVAL_SECONDS: ${APP_KRAKEN_LEDGER_MIN_INTERVAL_SECONDS:-9}
      APP_KRAKEN_RATE_LIMIT_RETRY_BASE_SECONDS: ${APP_KRAKEN_RATE_LIMIT_RETRY_BASE_SECONDS:-30}
      APP_KRAKEN_API_MAX_RETRIES: ${APP_KRAKEN_API_MAX_RETRIES:-2}
      APP_KRAKEN_SYNC_INITIAL_START: ${APP_KRAKEN_SYNC_INITIAL_START:-2020-01-01T00:00:00Z}
      APP_KRAKEN_SYNC_LOOKBACK_SECONDS: ${APP_KRAKEN_SYNC_LOOKBACK_SECONDS:-604800}
      APP_KRAKEN_SYNC_SETTLEMENT_LAG_SECONDS: ${APP_KRAKEN_SYNC_SETTLEMENT_LAG_SECONDS:-300}
      APP_KRAKEN_SYNC_STALE_SECONDS: ${APP_KRAKEN_SYNC_STALE_SECONDS:-3600}
      APP_EXPORT_DIRECTORY: /exports
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - database:/data
      - logs:/logs
      - exports:/exports
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database:
  logs:
  exports:
