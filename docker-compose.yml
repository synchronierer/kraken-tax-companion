services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-sqlite:////data/kraken-tax-companion.db}
      APP_CORS_ORIGINS: '${APP_CORS_ORIGINS:-["http://localhost:5173"]}'
      APP_COINGECKO_BASE_URL: ${APP_COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
      APP_COINGECKO_API_MODE: ${APP_COINGECKO_API_MODE:-disabled}
      APP_COINGECKO_API_KEY: ${APP_COINGECKO_API_KEY:-}
      APP_COINGECKO_TIMEOUT_SECONDS: ${APP_COINGECKO_TIMEOUT_SECONDS:-15}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - database:/data
      - logs:/logs
      - exports:/exports
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database:
  logs:
  exports:
